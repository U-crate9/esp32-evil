name: Build ESP-01 Bridge

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP8266 Core
        run: |
          arduino-cli core update-index --additional-urls https://arduino.esp8266.com/stable/package_esp8266com_index.json
          arduino-cli core install esp8266:esp8266 --additional-urls https://arduino.esp8266.com/stable/package_esp8266com_index.json

      - name: Compile ESP-01
        run: |
          mkdir -p esp01_out
          arduino-cli compile --fqbn esp8266com:esp8266:esp01:eesz=1M64 --output-dir esp01_out esp01_source/esp01_bridge.ino

      - name: Upload ESP-01 Artifact
        uses: actions/upload-artifact@v3
        with:
          name: esp01-bridge-binary
          path: esp01_out/*.bin
