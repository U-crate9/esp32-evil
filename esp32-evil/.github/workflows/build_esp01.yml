name: Build ESP-01 Bridge

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP8266 Core
        run: |
          arduino-cli core update-index --additional-urls https://arduino.esp8266.com/stable/package_esp8266com_index.json
          arduino-cli core install esp8266:esp8266 --additional-urls https://arduino.esp8266.com/stable/package_esp8266com_index.json

      - name: Compile ESP-01 Sketch
        run: |
          mkdir -p build_out
          arduino-cli compile --fqbn esp8266com:esp8266:generic:eesz=4M1M,lwip=v2,cpu=80 --output-dir build_out esp01_source/esp01_bridge.ino

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v3
        with:
          name: esp01-bridge-bin
          path: build_out/*.bin
